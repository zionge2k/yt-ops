[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytops"
version = "0.1.0"
description = "8-channel YouTube operations dashboard (read-only)"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client",
    "google-auth",
    "psycopg[binary]",
    "python-dotenv",
    "cryptography",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ytops = "ytops.cli:main"

[tool.setuptools.packages.find]
include = ["ytops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
