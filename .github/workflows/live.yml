name: live

on:
  schedule:
    # 2시간마다: 방송 중일 때만 스냅샷 한 줄(동시 시청자 · 송출 상태)을 남기고 화면을 다시 만든다 (일일 수집은 daily.yml)
    - cron: '0 */2 * * *'
  workflow_dispatch:

# daily 와 다른 group — 같은 group 이면 대기 중인 daily 가 live 에 밀려 취소될 수 있다.
concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 금고 받기
        uses: actions/checkout@v4
        with:
          repository: zionge2k/yt-channels-vault
          ssh-key: ${{ secrets.VAULT_SSH_KEY }}
          path: vault

      - name: 금고 풀기 (토큰은 러너 임시 폴더에만)
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          umask 077
          # age 배포본은 지문(SHA256)이 맞을 때만 푼다 — daily.yml 과 같은 값. 버전을 올리면 두 파일을 같이 바꾼다.
          AGE_URL="https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz"
          AGE_SHA256="7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"
          curl -sSL -o "$RUNNER_TEMP/age.tgz" "$AGE_URL"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tgz" | sha256sum -c - || { echo "⛔ age 지문 불일치 — 다운로드를 믿을 수 없어 중단"; exit 1; }
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/age.tgz" && rm -f "$RUNNER_TEMP/age.tgz"
          printf '%s\n' "$AGE_KEY" > "$RUNNER_TEMP/age.key"
          "$RUNNER_TEMP/age/age" -d -i "$RUNNER_TEMP/age.key" vault/yt-channels.tar.age | tar -xz -C "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/age.key"
          echo "YT_CHANNELS_HOME=$RUNNER_TEMP/yt-channels" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Deploy must happen even if collection reports errors; failure is surfaced in the last step.
      - name: 라이브 수집
        id: collect
        continue-on-error: true
        # explicit shell: the default `bash -e` has no pipefail, so tee would hide python's exit code
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m ytops collect --all --only live | tee "$RUNNER_TEMP/collect.log"

      # Monitoring 읽기 전용 · 키 없음(Workload Identity Federation). 실패해도 수집·배포는 계속.
      - name: Google 인증 (사용량 읽기)
        id: gauth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/240395376214/locations/global/workloadIdentityPools/github/providers/github
          service_account: yt-ops-monitor@nowbrd-release.iam.gserviceaccount.com

      - name: API 사용량 읽기
        if: steps.gauth.outcome == 'success'
        continue-on-error: true
        run: python -m ytops quota --json --out "$RUNNER_TEMP/quota.json"

      - name: 화면 데이터 만들기
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m ytops render --out "$RUNNER_TEMP/data.json" --quota "$RUNNER_TEMP/quota.json"

      - name: 암호화
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: |
          rm -f site/sample.json
          python -m ytops encrypt "$RUNNER_TEMP/data.json" site/data.enc

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 배포
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 수집 오류 알림
        if: steps.collect.outcome == 'failure'
        run: |
          # 한도가 바닥난 날은 오류가 전부 403 quota 라 경고만 남기고 끝낸다 (2시간마다 실패 메일이 쌓이지 않게)
          if grep -q '^quota_exhausted=1$' "$RUNNER_TEMP/collect.log" 2>/dev/null; then
            echo "::warning::YouTube API 일일 한도 소진 — 라이브 수집 건너뜀"
            exit 0
          fi
          echo "라이브 수집 오류 있음 — 로그 확인"
          exit 1
