name: daily

on:
  schedule:
    # 00:30 UTC = KST 09:30
    - cron: '30 0 * * *'
    # 한 번만: 11/08 17:30 KST — 11/07 한도 사고로 실패한 shorts-factory 4채널 복구. 돌고 나면 지운다.
    - cron: '30 8 8 11 *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '과거 N일 다시 채우기 (0 이면 평소 수집, 첫 실행은 365 — 구독자 1년 그래프용)'
        type: number
        default: 0

# live.yml 과 같은 group — Pages 배포가 서로 겹치지 않게 차례로 돈다.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # 아래 keep-alive 단계가 workflow enable 을 호출하는 데 필요

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 금고 받기
        uses: actions/checkout@v4
        with:
          repository: zionge2k/yt-channels-vault
          ssh-key: ${{ secrets.VAULT_SSH_KEY }}
          path: vault

      - name: 금고 풀기 (토큰은 러너 임시 폴더에만)
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          umask 077
          # age 배포본은 지문(SHA256)이 맞을 때만 푼다 — 2026-11-07 두 번 받아 확인한 값. 버전을 올리면 이 값도 같이 바꾼다.
          AGE_URL="https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz"
          AGE_SHA256="7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50"
          curl -sSL -o "$RUNNER_TEMP/age.tgz" "$AGE_URL"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tgz" | sha256sum -c - || { echo "⛔ age 지문 불일치 — 다운로드를 믿을 수 없어 중단"; exit 1; }
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/age.tgz" && rm -f "$RUNNER_TEMP/age.tgz"
          printf '%s\n' "$AGE_KEY" > "$RUNNER_TEMP/age.key"
          "$RUNNER_TEMP/age/age" -d -i "$RUNNER_TEMP/age.key" vault/yt-channels.tar.age | tar -xz -C "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/age.key"
          echo "YT_CHANNELS_HOME=$RUNNER_TEMP/yt-channels" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Schema is idempotent (if not exists / add column if not exists): keeps the DB in step with db/schema.sql.
      - name: 스키마 맞추기
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m ytops schema --apply

      # Deploy must happen even if collection reports errors; failure is surfaced in the last step.
      - name: 수집
        id: collect
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
        run: |
          if [ "${BACKFILL_DAYS:-0}" -gt 0 ]; then
            python -m ytops backfill --all --days "$BACKFILL_DAYS"
          else
            python -m ytops collect --all
          fi

      - name: 화면 데이터 만들기
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m ytops render --out "$RUNNER_TEMP/data.json"

      - name: 암호화
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: |
          rm -f site/sample.json
          python -m ytops encrypt "$RUNNER_TEMP/data.json" site/data.enc

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 배포
        id: deploy
        uses: actions/deploy-pages@v4

      # GitHub 은 저장소에 60일간 커밋이 없으면 schedule 실행을 조용히 끈다.
      # 이 저장소는 매일 돌아도 커밋을 만들지 않으므로, 매 실행마다 워크플로를 다시 켜서 타이머를 되돌린다.
      # 아래 실패 알림 단계(exit 1)보다 앞에 둬서 수집이 실패한 날에도 실행되게 한다.
      - name: 예약 실행 유지 (60일 규칙)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable"

      - name: 수집 오류 알림
        if: steps.collect.outcome == 'failure'
        run: echo "수집 오류 있음 — 로그 확인" && exit 1
